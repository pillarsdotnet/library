name: Code Checker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24.19.0 onwards can abort better-sqlite3 during garbage collection:
          # https://github.com/nodejs/node/issues/65446. Keep in step with the Dockerfile.
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Refuse vulnerable or deprecated dependencies
        run: npm run check:deps
      - name: Syntax-check sources
        run: |
          node --check server.js
          node --check db.js
          node --check public/app.js

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24.19.0 onwards can abort better-sqlite3 during garbage collection:
          # https://github.com/nodejs/node/issues/65446. Keep in step with the Dockerfile.
          node-version: 24.18.1
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Run tests (unit + browser scanner regression)
        run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

  publish:
    name: Publish Docker image
    # Only a merge to main publishes, and only once both checks above pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
