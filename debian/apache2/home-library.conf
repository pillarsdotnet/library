# Home Library, served under /library/ from the home-library service's Unix
# socket. Enabled with "a2enconf home-library"; needs mod_proxy, mod_proxy_http
# and mod_headers, which the package enables.
RedirectMatch 301 ^/library$ /library/

<Location "/library/">
    ProxyPass "unix:/run/home-library/home-library.sock|http://localhost/library/"
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # EPUB uploads; Apache's default allows them already, this keeps the same
    # 80 MB cap the nginx snippet sets.
    LimitRequestBody 83886080
</Location>
