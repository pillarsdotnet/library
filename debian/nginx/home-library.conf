# Home Library, served under /library/ from the home-library service's Unix
# socket. Include this inside a server { } block of your site:
#     include snippets/home-library.conf;
location = /library {
    absolute_redirect off;
    return 301 /library/;
}
location /library/ {
    client_max_body_size 80m;   # allow EPUB uploads (default nginx cap is 1m)
    proxy_pass http://unix:/run/home-library/home-library.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
