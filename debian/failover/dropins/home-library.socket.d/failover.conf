# Installed by `home-library-failover enable`; removed by `disable`.
[Unit]
# The socket is ordered before sockets.target, long before the network the
# db unit waits for, so it cannot be ordered after the db unit without a
# cycle. It is skipped at boot instead -- the flag does not exist yet -- and
# home-library-vip.service pulls it in once db-claim has created the flag.
ConditionPathExists=/run/home-library-active
