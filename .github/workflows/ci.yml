name: Code Checker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24.19.0 onwards can abort better-sqlite3 during garbage collection:
          # https://github.com/nodejs/node/issues/65446. Keep in step with the Dockerfile.
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Refuse vulnerable or deprecated dependencies
        run: npm run check:deps
      - name: Syntax-check sources
        run: |
          node --check server.js
          node --check db.js
          node --check public/app.js

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24.19.0 onwards can abort better-sqlite3 during garbage collection:
          # https://github.com/nodejs/node/issues/65446. Keep in step with the Dockerfile.
          node-version: 24.18.1
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Run tests (unit + browser scanner regression)
        run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
