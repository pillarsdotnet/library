name: Code Checker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in step with the Dockerfile's node:24 base.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Refuse vulnerable or deprecated dependencies
        run: npm run check:deps
      - name: Syntax-check sources
        run: |
          node --check server.js
          node --check db.js
          node --check public/app.js

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in step with the Dockerfile's node:24 base.
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Run tests (unit + browser scanner regression)
        run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

  image:
    name: Image ${{ matrix.variant }} ${{ matrix.arch }}
    # Every variant on every architecture, on PRs too: each image is built on a
    # native runner and checked from inside, where its better-sqlite3 was
    # compiled and its zoneinfo either is or is not. On main it is also pushed,
    # untagged; the publish job tags it only once everything has passed.
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, alpine]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VARIANT=${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: library:test
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: Check the image from inside
        run: >-
          docker run --rm library:test node --test
          test/gc-stress.test.mjs test/timezone.test.mjs test/due-dates.test.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Everything is cached from the build above, so this only uploads it.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VARIANT=${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.variant }} image
    # Only a merge to main publishes, and only once every check and every image
    # has passed. Each variant gets one set of tags covering both architectures.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, image]
    strategy:
      matrix:
        variant: [slim, alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # slim is the default image and carries the plain tags; alpine
          # carries the same tags with -alpine on the end.
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'alpine' && '-alpine' || '' }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
      - name: Tag both architectures under one name
        working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("ghcr.io/${{ github.repository }}@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Show what was published
        run: docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
