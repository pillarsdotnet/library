# Installed by `home-library-failover enable`; removed by `disable`.
[Unit]
# Skipped, not failed, on a standby: only the active node has the flag.
ConditionPathExists=/run/home-library-active
# Never start unless the database handoff has already run here. Requisite=,
# not Requires=: a request reaching the socket must not START the handoff.
Requisite=home-library-db.service
# Stop before the db unit, so db-release finds the database quiescent.
After=home-library-db.service
